<div class="card">
  <div class="head drag-handle" title="Drag to move">
    <span class="grip">⠿</span>
    <app-panel-title [name]="note().name" (renamed)="store.updateNote(note().id, { name: $event })" (dblclick)="openEdit()" />
    <button class="icon font" (click)="font(-1)" [disabled]="note().fontSize <= FONT.min" title="Smaller text">A−</button>
    <button class="icon font" (click)="font(1)" [disabled]="note().fontSize >= FONT.max" title="Larger text">A+</button>
    <button class="icon" (click)="openEdit()" title="Settings">⚙</button>
    <button class="icon" (click)="store.closeNote(note().id)" title="Put away — the note is saved; bring it back with ▾ next to “Note” in the toolbar">—</button>
    <button class="icon" (click)="remove($event)" title="Delete (Shift+click to skip confirmation)">✕</button>
  </div>

  <textarea
    [value]="note().text"
    (input)="onText($event)"
    [style.font-size.px]="note().fontSize"
    placeholder="Write anything… camp notes, quest steps, who to group with."
    spellcheck="true"
  ></textarea>
</div>

<dialog #dlg>
  <h3>Note settings</h3>
  <div class="edit">
    <label>Title <input [value]="note().name" (change)="rename($event)" (keydown.enter)="closeEdit()" /></label>
    <p class="hint">Text size: {{ note().fontSize }}px — use A− / A+ on the note to change it.</p>
  </div>
  <div class="dialog-actions">
    <button class="danger" (click)="remove($event)">Delete</button>
    <span class="spacer"></span>
    <button (click)="closeEdit(); store.closeNote(note().id)" title="Save it off the board; reopen with ▾ next to “Note”">Put away</button>
    <button class="primary" (click)="closeEdit()">Done</button>
  </div>
</dialog>
