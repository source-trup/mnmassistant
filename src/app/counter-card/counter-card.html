<div class="card" [class.reached]="reachedTarget()">
  <div class="head drag-handle" title="Drag to move">
    <span class="grip">⠿</span>
    <app-panel-title [name]="counter().name" (renamed)="store.updateCounter(counter().id, { name: $event })" />
    <button
      class="icon pop"
      (click)="popout.toggle(counter().id)"
      [title]="popout.isPopped(counter().id) ? 'Put back on the board' : 'Pop out into its own window (stays on top)'"
    >{{ popout.isPopped(counter().id) ? '⤓' : '⧉' }}</button>
    <button class="icon" (click)="openEdit()" title="Settings">⚙</button>
    <button class="icon" (click)="remove($event)" title="Delete (Shift+click to skip confirmation)">✕</button>
  </div>

  <div class="body">
    <button class="minus" (click)="store.bump(counter().id, -1)" title="Subtract {{ counter().step }}">−</button>
    <button class="value" (click)="store.bump(counter().id, 1)" title="Add {{ counter().step }}">
      <span class="num">{{ counter().value }}</span>
      @if (counter().target !== null) {
        <span class="target">/ {{ counter().target }}</span>
      }
    </button>
    <button class="plus" (click)="store.bump(counter().id, 1)" [title]="'Add ' + counter().step">+</button>
  </div>

  <div class="foot">
    <span class="rate">
      @if (perHour(); as rate) { {{ rate }}/hr }
    </span>
    <button class="small" (click)="reset()">Reset</button>
  </div>
</div>

<dialog #dlg>
  <h3>Counter settings</h3>
  <div class="edit">
    <label>Name <input [value]="counter().name" (change)="rename($event)" /></label>
    <label>Value <input type="number" [value]="counter().value" (change)="setNumber('value', $event)" /></label>
    <label>Step <input type="number" min="1" [value]="counter().step" (change)="setNumber('step', $event)" /></label>
    <label>
      Goal
      <input type="number" [value]="counter().target ?? ''" (change)="setNumber('target', $event)" placeholder="none" />
    </label>
  </div>
  <div class="dialog-actions">
    <button class="danger" (click)="remove($event)">Delete</button>
    <span class="spacer"></span>
    <button class="primary" (click)="closeEdit()">Done</button>
  </div>
</dialog>
